<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Abacus</title>
<style>
  :root {
    --bg: #020a14;
    --bg-glow: #0a2744;
    --panel: #061a33;
    --panel-lt: #0b2d52;
    --blue: #1e88e5;
    --blue-text: #5fb3ff;
    --ink: #ffffff;
    --ink-dim: #bcd4f0;
    --wire: #1e3a5c;
    --back: #ffe600;
    /* status colours: one meaning each */
    --s-notstarted: #d400ff;
    --s-underway: #ff8c00;
    --s-completed: #00e5d4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 90% 60% at 50% 0%, var(--bg-glow), var(--bg) 70%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 18px 14px 40px;
    min-height: 100vh;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  h1 {
    font-size: 26px;
    color: var(--blue-text);
    text-shadow: 0 0 12px rgba(30,136,229,.9);
  }

  h1 { margin-bottom: 16px; }

  /* Nav bar: yellow Back + blue breadcrumbs */
  .nav {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .nav[hidden] { display: none; }
  .back-btn {
    min-height: 44px;
    padding: 0 18px;
    background: var(--back);
    color: #000;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 10px var(--back);
  }
  .crumb {
    min-height: 44px;
    padding: 0 12px;
    background: var(--panel);
    border: 2px solid var(--blue);
    color: var(--blue-text);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .crumb.current { background: var(--panel-lt); color: var(--ink); cursor: default; }
  .crumb-sep { color: var(--blue); font-weight: 700; }

  /* Board */
  .board-title {
    font-size: 21px;
    color: var(--blue-text);
    text-shadow: 0 0 10px rgba(30,136,229,.7);
    margin-bottom: 12px;
  }

  .rows { display: grid; gap: 10px; }

  /* One bead = one card. Colour lives only in the left bar, status word and bead. */
  .row {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--blue);
    border-radius: 12px;
    padding: 12px 14px 8px 20px;
    overflow: hidden;
  }
  .row::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--status, transparent);
  }

  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .bead-name { font-size: 17px; font-weight: 700; line-height: 1.3; }
  .status-word {
    display: block;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--status, var(--ink-dim));
    margin-top: 2px;
  }

  .open-btn {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    background: var(--panel-lt);
    border: 2px solid var(--blue);
    color: var(--blue-text);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Wire */
  .wire-row { padding: 22px 16px 4px; }
  .wire {
    position: relative;
    height: 6px;
    background: var(--wire);
    border-radius: 999px;
    cursor: pointer;
  }
  .wire::after {
    /* larger invisible tap area */
    content: "";
    position: absolute;
    left: -16px; right: -16px; top: -18px; bottom: -18px;
  }
  .wire-labels {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 14px;
  }

  .bead {
    position: absolute;
    top: 50%;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: var(--status);
    box-shadow: 0 0 10px var(--status), 0 0 22px var(--status);
    transition: left 0.3s cubic-bezier(.34,1.4,.4,1);
    cursor: grab;
    touch-action: none;
    z-index: 2;
  }
  .bead.dragging { transition: none; cursor: grabbing; }
  .bead.at-done { animation: chime 0.6s ease-out; }
  @keyframes chime {
    0% { box-shadow: 0 0 0 0 var(--status); }
    60% { box-shadow: 0 0 0 16px transparent; }
    100% { box-shadow: 0 0 10px var(--status), 0 0 22px var(--status); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bead { transition: none; }
    .bead.at-done { animation: none; }
  }

  .placeholder-note { font-size: 15px; color: var(--ink-dim); padding: 6px 0 4px; }

  footer {
    margin-top: 24px;
    border-top: 1px solid var(--blue);
    padding-top: 10px;
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>The Abacus</h1>

  <nav class="nav" id="nav"></nav>
  <main id="board"></main>

  <footer>
    Status: purple not started · orange underway · turquoise completed.<br>
    Prototype. Not connected to live data, and changes are not saved.
  </footer>
</div>

<script>
  // --- Data: each level is a board of beads; a bead can open a child board ---
  const insuranceTypesTFT = {
    title: "TFT insurances",
    beads: [
      { id: "pl", name: "Public Liability", pos: 100 },
      { id: "pi", name: "Professional Indemnity", pos: 55 },
      { id: "veh", name: "Vehicles", pos: 15 },
      { id: "etc", name: "Other insurances", pos: 0 },
    ],
  };

  const insuranceCompanies = {
    title: "Insurances",
    beads: [
      { id: "km", name: "Killin Management (KM)", pos: 80 },
      { id: "nccs", name: "Native Conifer Carbon Sink (NCCS)", pos: 45 },
      { id: "tft", name: "Tropical Fire Technologies (TFT)", pos: 55, child: insuranceTypesTFT },
    ],
  };

  const theme1 = {
    title: "Compliance & Regulatory",
    beads: [
      { id: "cmi", name: "CMI Code of Conduct", pos: 30 },
      { id: "ins", name: "Insurances", pos: 55, child: insuranceCompanies },
      { id: "forestry", name: "Forestry Australia Membership", pos: 10 },
      { id: "asic", name: "ASIC Company Docs", pos: 80 },
      { id: "accred", name: "Other Accreditations", pos: 0 },
    ],
  };

  const root = {
    title: "Themes",
    beads: [
      { id: "t1", name: "Compliance & Regulatory", pos: 35, child: theme1 },
      { id: "t2", name: "Budgeting & Finance", pos: 0, placeholder: true },
      { id: "t3", name: "Comms (internal) & Media (external)", pos: 0, placeholder: true },
      { id: "t4", name: "NCCS SylvaNaut Project", pos: 0, placeholder: true },
      { id: "t5", name: "TFT Savanna Fire Ops Projects", pos: 0, placeholder: true },
      { id: "t6", name: "Partnerships, Alliances, Biz Dev, Growth & Funding", pos: 0, placeholder: true },
    ],
  };

  const STATUS = {
    notstarted: { word: "Not started", color: "var(--s-notstarted)" },
    underway:   { word: "Underway",    color: "var(--s-underway)" },
    completed:  { word: "Completed",   color: "var(--s-completed)" },
  };

  function statusOf(pos) {
    if (pos <= 0) return STATUS.notstarted;
    if (pos >= 100) return STATUS.completed;
    return STATUS.underway;
  }

  // Ends snap so "not started" and "completed" are easy to hit on a phone.
  function posFromPointer(wire, clientX) {
    const rect = wire.getBoundingClientRect();
    const pct = ((clientX - rect.left) / rect.width) * 100;
    if (pct <= 4) return 0;
    if (pct >= 96) return 100;
    return Math.round(pct);
  }

  // --- Router: each level has its own URL, e.g. #/t1/ins/tft ---
  let stack = [root];

  function resolveStackFromHash() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    let cur = root;
    const s = [root];
    for (const part of parts) {
      const bead = cur.beads.find(b => b.id === part && b.child);
      if (!bead) break;
      cur = bead.child;
      s.push(cur);
    }
    return s;
  }

  function pathForStack(s) {
    const parts = [];
    for (let i = 0; i < s.length - 1; i++) {
      const bead = s[i].beads.find(b => b.child === s[i + 1]);
      if (bead) parts.push(bead.id);
    }
    return parts.join("/");
  }

  function navigateTo(newStack) {
    stack = newStack;
    const path = pathForStack(stack);
    history.pushState(null, "", path ? `#/${path}` : "#/");
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener("popstate", () => {
    stack = resolveStackFromHash();
    render();
  });

  // --- Rendering ---
  function renderNav() {
    const nav = document.getElementById("nav");
    nav.hidden = stack.length === 1;
    const back = stack.length > 1 ? `<button class="back-btn" id="backBtn">Back</button>` : "";
    const crumbs = stack.slice(0, -1).map((b, i) =>
      (i > 0 ? `<span class="crumb-sep">›</span>` : "") +
      `<button class="crumb" data-idx="${i}">${b.title}</button>`
    ).join("");
    nav.innerHTML = back + crumbs;

    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", () => navigateTo(stack.slice(0, -1)));
    nav.querySelectorAll(".crumb").forEach(btn => {
      btn.addEventListener("click", () => navigateTo(stack.slice(0, Number(btn.dataset.idx) + 1)));
    });
  }

  function rowHtml(b) {
    if (b.placeholder) {
      return `
        <div class="row">
          <div class="row-top"><span class="bead-name">${b.name}</span></div>
          <div class="placeholder-note">No beads yet</div>
        </div>`;
    }
    return `
      <div class="row" data-row="${b.id}">
        <div class="row-top">
          <div>
            <span class="bead-name">${b.name}</span>
            <span class="status-word"></span>
          </div>
          ${b.child ? `<button class="open-btn" data-open="${b.id}">Open ›</button>` : ""}
        </div>
        <div class="wire-row">
          <div class="wire" data-wire="${b.id}">
            <div class="bead" data-bead="${b.id}"></div>
          </div>
          <div class="wire-labels"><span>Not started</span><span>Completed</span></div>
        </div>
      </div>`;
  }

  function paint(b, animate) {
    const row = document.querySelector(`.row[data-row="${b.id}"]`);
    if (!row) return;
    const st = statusOf(b.pos);
    row.style.setProperty("--status", st.color);
    row.querySelector(".status-word").textContent = st.word;
    const bead = row.querySelector(".bead");
    bead.style.left = `${b.pos}%`;
    if (animate && b.pos >= 100) {
      bead.classList.remove("at-done");
      void bead.offsetWidth;
      bead.classList.add("at-done");
    }
  }

  function renderBoard() {
    const board = stack[stack.length - 1];
    const container = document.getElementById("board");
    container.innerHTML = `
      <h2 class="board-title">${board.title}</h2>
      <div class="rows">${board.beads.map(rowHtml).join("")}</div>`;

    board.beads.filter(b => !b.placeholder).forEach(b => {
      paint(b, false);
      const wire = container.querySelector(`[data-wire="${b.id}"]`);
      const bead = container.querySelector(`[data-bead="${b.id}"]`);

      wire.addEventListener("click", (e) => {
        if (e.target === bead) return;
        b.pos = posFromPointer(wire, e.clientX);
        paint(b, true);
      });

      let dragging = false;
      bead.addEventListener("pointerdown", (e) => {
        dragging = true;
        bead.classList.add("dragging");
        bead.setPointerCapture(e.pointerId);
      });
      bead.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        b.pos = posFromPointer(wire, e.clientX);
        paint(b, false);
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        bead.classList.remove("dragging");
        paint(b, true);
      };
      bead.addEventListener("pointerup", endDrag);
      bead.addEventListener("pointercancel", endDrag);

      const openBtn = container.querySelector(`[data-open="${b.id}"]`);
      if (openBtn) openBtn.addEventListener("click", () => navigateTo([...stack, b.child]));
    });
  }

  function render() {
    renderNav();
    renderBoard();
  }

  stack = resolveStackFromHash();
  render();
</script>
</body>
</html>
